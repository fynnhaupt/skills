version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 1
    groups:
      minor-patch-prod:
        dependency-type: 'production'
        update-types:
          - minor
          - patch
      minor-patch-dev:
        dependency-type: 'development'
        update-types:
          - minor
          - patch
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns: ['*']
